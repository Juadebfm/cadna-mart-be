version: '3.9'

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    ports:
      - '3000:3000'
      - '9229:9229'
    volumes:
      - ../src:/app/src
    env_file:
      - ../.env.dev
    environment:
      - DATABASE_URL=postgresql://cadna_admin:cadna_secret@postgres:5432/cadna_mart_dev?schema=public
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - cadna-network

  postgres:
    image: postgres:16
    ports:
      - '27017:27017'
    environment:
      POSTGRES_USER: cadna_admin
      POSTGRES_PASSWORD: cadna_secret
      POSTGRES_DB: cadna_mart_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cadna-network

volumes:
  postgres_data:

networks:
  cadna-network:
    driver: bridge
